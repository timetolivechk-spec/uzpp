<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 200" width="720" height="200" role="img" aria-label="uz++ — monochrome">
  <title>uz++ logo — monochrome</title>
  <desc>uz++ programming language — monochrome wordmark for print or single-color contexts</desc>

  <!-- Single-color version: works on light backgrounds; invert fill for dark bg -->
  <g fill="#1a1a1a">
    <!-- 8-pointed girih star (solid, no gradients) -->
    <g transform="translate(100 100)">
      <rect x="-58" y="-58" width="116" height="116" transform="rotate(45)"/>
      <rect x="-58" y="-58" width="116" height="116"/>
      <!-- Inner cut-out for star detail -->
      <g fill="#ffffff">
        <rect x="-22" y="-22" width="44" height="44" transform="rotate(22.5)"/>
      </g>
    </g>

    <!-- Wordmark "uz++" -->
    <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="900">
      <text x="210" y="138" font-size="118" letter-spacing="-3">uz</text>
      <text x="338" y="100" font-size="78" letter-spacing="-2">++</text>
    </g>

    <!-- Tagline -->
    <text x="212" y="172" font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-size="18" font-style="italic" letter-spacing="0.4" opacity="0.7">
      o'zbek tilida zamonaviy dasturlash
    </text>
  </g>
</svg>
