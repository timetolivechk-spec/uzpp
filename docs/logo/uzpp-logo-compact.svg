<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 140" width="480" height="140" role="img" aria-label="uz++">
  <title>uz++ logo — compact</title>
  <desc>uz++ programming language — compact horizontal lockup without tagline</desc>

  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#F4B83E"/>
      <stop offset="55%"  stop-color="#E8A917"/>
      <stop offset="100%" stop-color="#B8780C"/>
    </linearGradient>
    <linearGradient id="goldGrad2" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%"   stop-color="#FFCE5A"/>
      <stop offset="100%" stop-color="#D89510"/>
    </linearGradient>
  </defs>

  <!-- 8-pointed girih star -->
  <g transform="translate(70 70)">
    <rect x="-42" y="-42" width="84" height="84" fill="url(#goldGrad)" transform="rotate(45)"/>
    <rect x="-42" y="-42" width="84" height="84" fill="url(#goldGrad2)" opacity="0.92"/>
    <g opacity="0.18">
      <rect x="-20" y="-20" width="40" height="40" fill="#2c3e50" transform="rotate(22.5)"/>
    </g>
    <rect x="-42" y="-42" width="84" height="84" fill="none" stroke="#8B5A05" stroke-width="1.1" transform="rotate(45)" opacity="0.45"/>
  </g>

  <!-- Wordmark "uz++" -->
  <g font-family="'Segoe UI', 'Helvetica Neue', Arial, sans-serif" font-weight="900">
    <text x="150" y="100" font-size="90" fill="#2c3e50" letter-spacing="-2.5">uz</text>
    <text x="248" y="72"  font-size="60" fill="#3498db" letter-spacing="-1.5">++</text>
  </g>
</svg>
