name: uz++ Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

# ─── Helper: what files go into the compiler zip ─────────────────────────────
# Each platform job builds uzpp[.exe] then bundles it with stdlib/ into an archive.
# The archive layout (which componentManager.js expects):
#   uzpp-windows-x64.zip:
#     uzpp.exe
#     stdlib/uzpp_runtime.hpp
#     stdlib/...
#   uzpp-linux-x64.tar.gz:
#     uzpp
#     stdlib/...
#   (same for macos)

jobs:
  # ──────────────────────────────────────────────────────────
  build-windows:
    name: Windows — uzpp + stdlib zip
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: actions/checkout@v4

      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja

      - name: Build
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build
          cmake --build build --config Release

      - name: Run unit tests
        run: ./build/uzpp_frontend_tests.exe

      - name: Package uzpp-windows-x64.zip
        shell: pwsh
        run: |
          $pkg = "pkg-windows"
          New-Item -ItemType Directory -Path $pkg | Out-Null
          Copy-Item build/uzpp.exe $pkg/
          Copy-Item -Recurse stdlib $pkg/stdlib
          Compress-Archive -Path $pkg/* -DestinationPath uzpp-windows-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: uzpp-windows-x64
          path: uzpp-windows-x64.zip

      # Stash the freshly-built uzpp.exe so the installer job can use it
      # without re-compiling.
      - uses: actions/upload-artifact@v4
        with:
          name: uzpp-windows-exe-raw
          path: build/uzpp.exe

  # ──────────────────────────────────────────────────────────
  # Build uzpp-setup.exe — single Inno-Setup-packaged installer that
  # bundles uzpp.exe + stdlib + misollar + MinGW so end users get a
  # "download → double-click → done" experience.
  # ──────────────────────────────────────────────────────────
  build-windows-installer:
    name: Windows — uzpp-setup.exe (Inno Setup)
    needs: [build-windows, package-mingw]
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Get version from tag
        id: version
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}" -replace '^v', ''
          echo "version=$version" >> $env:GITHUB_OUTPUT
          Write-Host "Version: $version"

      - name: Download uzpp.exe artifact
        uses: actions/download-artifact@v4
        with:
          name: uzpp-windows-exe-raw
          path: artifacts/uzpp

      - name: Download MinGW artifact
        uses: actions/download-artifact@v4
        with:
          name: mingw-w64-windows
          path: artifacts/mingw

      - name: Stage dist/ for Inno Setup
        shell: pwsh
        run: |
          $dist = "dist"
          New-Item -ItemType Directory -Path $dist -Force | Out-Null

          # uzpp.exe + stdlib + misollar + LICENSE
          Copy-Item artifacts/uzpp/uzpp.exe $dist/
          Copy-Item -Recurse stdlib   $dist/stdlib
          Copy-Item -Recurse misollar $dist/misollar
          Copy-Item LICENSE $dist/LICENSE.txt

          # README.txt shown by installer after install
          @"
          uz++ - O'zbek Dasturlash Tili
          =============================

          Tezda ishga tushirish | Quick start:
            uzpp ishga-tushirish misollar\01_salom_dunyo.uzpp

          Bundled C++ compiler: compiler\bin\g++.exe (MinGW-w64 GCC 15.2 UCRT)
          VS Code kengaytmasi: Marketplace -> uzpp.uzpp
          GitHub: https://github.com/timetolivechk-spec/uzpp
          "@ | Set-Content -Path $dist/README.txt -Encoding utf8

          # Extract bundled MinGW into dist\compiler\
          Expand-Archive -Force -Path artifacts/mingw/mingw-w64-windows-x64.zip `
                         -DestinationPath dist/winlibs-extracted
          # WinLibs zip extracts into a top-level `mingw64\` folder; rename it.
          Move-Item dist/winlibs-extracted/mingw64 dist/compiler
          Remove-Item -Recurse -Force dist/winlibs-extracted

          # Sanity: list staging tree top level
          Get-ChildItem dist | Format-Table Name, Length

      - name: Compile installer with Inno Setup
        shell: pwsh
        run: |
          # Inno Setup 6 is pre-installed on windows-latest GitHub runners.
          $iscc = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          if (-not (Test-Path $iscc)) {
            # Fallback: install via Chocolatey if the pre-installed path moved.
            choco install -y innosetup
            $iscc = "C:\Program Files (x86)\Inno Setup 6\iscc.exe"
          }
          & $iscc /DAppVersion="${{ steps.version.outputs.version }}" `
                  installer/windows/installer.iss
          Get-ChildItem installer/windows/Output

      - name: Rename to canonical artifact name
        shell: pwsh
        run: |
          # The .iss writes Output\uzpp-setup.exe — keep that name on disk.
          Copy-Item installer/windows/Output/uzpp-setup.exe uzpp-setup.exe

      - uses: actions/upload-artifact@v4
        with:
          name: uzpp-setup-windows
          path: uzpp-setup.exe

  # ──────────────────────────────────────────────────────────
  build-linux:
    name: Linux — uzpp + stdlib tar.gz
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (GCC-15 via toolchain PPA)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          # libstdc++-15-dev brings the <generator> header (C++23 coroutines).
          # libx11-dev / libgl1-mesa-dev are needed for the X11/GL targets
          # CMakeLists.txt links against on Linux (Grafika::Oyna stdlib).
          sudo apt-get install -y gcc-15 g++-15 libstdc++-15-dev cmake ninja-build libx11-dev libgl1-mesa-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 100

      - name: Build
        env:
          CC: gcc-15
          CXX: g++-15
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build
          cmake --build build --config Release

      - name: Run unit tests
        run: ./build/uzpp_frontend_tests

      - name: Package uzpp-linux-x64.tar.gz
        run: |
          mkdir pkg-linux
          cp build/uzpp pkg-linux/
          cp -r stdlib pkg-linux/stdlib
          tar -czf uzpp-linux-x64.tar.gz -C pkg-linux .

      - uses: actions/upload-artifact@v4
        with:
          name: uzpp-linux-x64
          path: uzpp-linux-x64.tar.gz

  # ──────────────────────────────────────────────────────────
  # macOS — universal binary (arm64 + x86_64) in one job.
  #
  # Two things macOS needs that no other platform does:
  #   1. AD-HOC CODE SIGNING. On Apple Silicon every executable must carry a
  #      signature or the kernel kills it outright ("zsh: killed"). The linker
  #      signs what it produces, but `strip`/`lipo` invalidate that signature —
  #      so we re-sign explicitly after packaging.
  #   2. NO QUARANTINE INSIDE THE TARBALL. `com.apple.quarantine` is applied by
  #      the *downloader*, not by us, but any xattr we ship survives the round
  #      trip. `COPYFILE_DISABLE=1` keeps tar from emitting AppleDouble
  #      (`._uzpp`) members that confuse extraction on other platforms.
  #
  # `install.sh` strips quarantine and re-signs on the user's machine; this job
  # makes sure the artifact is already in a state where that succeeds.
  build-macos:
    name: macOS universal — uzpp + stdlib tar.gz
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - run: brew install cmake ninja

      - name: Build arm64
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=arm64 -B build-arm64
          cmake --build build-arm64 --config Release

      - name: Build x86_64
        run: |
          cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_OSX_ARCHITECTURES=x86_64 -B build-x64
          cmake --build build-x64 --config Release

      - name: Run unit tests (arm64, native)
        run: ./build-arm64/uzpp_frontend_tests

      - name: End-to-end smoke test (arm64)
        run: |
          # Not just --version: this proves the generated compile command is
          # accepted by Apple Clang. The old hardcoded `-fmodules-ts` and
          # `-Wl,--gc-sections` failed here every time.
          mkdir -p smoke && cd smoke
          cat > salom.uzpp <<'UZPP'
          ulash "uzpp_runtime.hpp"

          butun asosiy() {
              yozish << "Salom, dunyo!" << qator_oxiri;
              qaytarish 0;
          }
          UZPP
          ../build-arm64/uzpp ishga-tushirish salom.uzpp

      - name: Package uzpp-macos-{arm64,x64,universal}.tar.gz
        run: |
          set -euo pipefail

          # Universal binary from the two slices.
          lipo -create -output uzpp-universal build-arm64/uzpp build-x64/uzpp
          lipo -info uzpp-universal

          # `lipo` output is unsigned — Apple Silicon refuses to run it.
          # Ad-hoc (`-`) signing needs no certificate and is enough here.
          codesign --force --sign - uzpp-universal
          codesign --verify --verbose uzpp-universal
          codesign --force --sign - build-arm64/uzpp
          codesign --force --sign - build-x64/uzpp

          package() {
            local name="$1" binary="$2"
            rm -rf "pkg-$name"
            mkdir -p "pkg-$name"
            cp "$binary" "pkg-$name/uzpp"
            chmod 0755 "pkg-$name/uzpp"
            cp -R stdlib "pkg-$name/stdlib"
            # Ship nothing quarantined and no AppleDouble sidecars.
            xattr -cr "pkg-$name"
            COPYFILE_DISABLE=1 tar -czf "uzpp-$name.tar.gz" -C "pkg-$name" .
          }

          package "macos-arm64"     build-arm64/uzpp
          package "macos-x64"       build-x64/uzpp
          package "macos-universal" uzpp-universal

          ls -la uzpp-macos-*.tar.gz

      - uses: actions/upload-artifact@v4
        with:
          name: uzpp-macos
          path: uzpp-macos-*.tar.gz

  # ──────────────────────────────────────────────────────────
  # Download a portable MinGW-w64 and re-upload as our release artifact.
  # Using WinLibs GCC 14.2.0 UCRT64 posix/seh (no MSYS2 required, pure portable).
  # URL: https://github.com/brechtsanders/winlibs_mingw/releases/
  # Pin a specific release for reproducibility.
  # ──────────────────────────────────────────────────────────
  package-mingw:
    name: Package MinGW-w64 for Windows
    runs-on: ubuntu-latest
    env:
      # WinLibs GCC 15.2.0 UCRT64 posix/seh — matches Linux CI's gcc-15.
      # Old tag (14.2.0posix-18.1.8-12.0.0-ucrt-r2) was 404 — WinLibs changed
      # naming conventions; today's scheme is <gcc>posix-<mingw-w64>-ucrt-r<N>.
      MINGW_VERSION: "15.2.0posix-14.0.0-ucrt-r7"
      MINGW_FILENAME: "winlibs-x86_64-posix-seh-gcc-15.2.0-mingw-w64ucrt-14.0.0-r7.zip"
    steps:
      - name: Download WinLibs MinGW
        run: |
          # -f makes curl exit non-zero on HTTP errors (else it would write
          # a 9-byte HTML error page and pretend everything was fine — exactly
          # what landed in v2.1.7 / first v2.1.8 release attempts).
          curl -fL --retry 3 -o mingw-source.zip \
            "https://github.com/brechtsanders/winlibs_mingw/releases/download/${MINGW_VERSION}/${MINGW_FILENAME}"
          # Sanity check: the archive is ~255 MB; if we got <100 MB something
          # is wrong (silent partial download, redirect HTML, etc).
          size=$(stat -c %s mingw-source.zip)
          echo "Downloaded $size bytes"
          if [ "$size" -lt 100000000 ]; then
            echo "ERROR: mingw zip is suspiciously small ($size bytes)"
            exit 1
          fi

      - name: Extract, strip unused data, re-zip
        run: |
          unzip -q mingw-source.zip -d mingw-extract
          cd mingw-extract/mingw64
          # Strip unused bloat — saves ~100 MB (255→~150 MB)
          rm -rf share/locale share/doc share/man share/info share/cmake \
                 share/gettext share/aclocal share/gtk-doc lib/python* \
                 include/X11 include/GL include/freetype2 include/gtk* \
                 include/cairo*
          # Zip from inside mingw-extract so the archive has `mingw64/` at the
          # root (not `mingw-extract/mingw64/`). The installer step expects
          # `Expand-Archive` to produce `dist/winlibs-extracted/mingw64/`.
          cd ..
          zip -r -q ../mingw-w64-windows-x64.zip mingw64
          cd ..
          rm -rf mingw-extract mingw-source.zip

      - uses: actions/upload-artifact@v4
        with:
          name: mingw-w64-windows
          path: mingw-w64-windows-x64.zip

  # ──────────────────────────────────────────────────────────
  # Create GitHub Release with all artifacts
  # ──────────────────────────────────────────────────────────
  release:
    name: GitHub Release
    needs: [build-windows, build-windows-installer, build-linux, build-macos, package-mingw]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Stage install.sh (Unix one-line installer)
        run: |
          # The release attaches installer/unix/install.sh as `install.sh`,
          # so users can run:
          #   curl -fsSL https://github.com/<repo>/releases/latest/download/install.sh | bash
          mkdir -p dist/install-sh
          cp installer/unix/install.sh dist/install-sh/install.sh

      - name: List artifacts
        run: find dist/ -type f | sort

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "uz++ ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            ## uz++ ${{ github.ref_name }}

            ### Tezkor o'rnatish (VS Code kengaytmasi orqali)

            1. VS Code Extensions → "uz++" → Install
            2. Welcome ekranida **"Hammasini o'rnatish"** tugmasini bosing
            3. F5 → dastur ishga tushadi

            ---

            ### Windows — bir-bosishlik installer (eng oson)

            ```
            uzpp-setup.exe ni yuklab oling → ikki marta bosing → tayyor.
            ```

            Installer ichida bor:
            - `uzpp.exe` (kompilyator)
            - `stdlib/` (standart kutubxona)
            - `misollar/` (10 ta misol)
            - `compiler/` (WinLibs GCC 15.2 UCRT — uzpp avtomatik ishlatadi)

            PATH avtomatik sozlanadi, `.uzpp` fayllari uzpp bilan ochiladi.
            Admin huquqlari kerak emas (`%LOCALAPPDATA%` ga o'rnatiladi).

            ---

            ### Qo'lda o'rnatish

            **Windows (faqat zip):**
            ```powershell
            curl -L -o uzpp.zip https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/uzpp-windows-x64.zip
            Expand-Archive uzpp.zip -DestinationPath uzpp-install
            # uzpp.exe + stdlib/ hazir
            ```

            **Linux / macOS — bitta buyruq bilan o'rnatish:**
            ```bash
            curl -fsSL https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/install.sh | bash
            ```

            Skript tizimni aniqlaydi, mos arxivni yuklaydi, `uzpp` ni
            `/usr/local/bin/` ga, `stdlib/` ni `/usr/local/lib/uzpp/` ga
            qo'yadi va C++ kompilyatori (g++/clang++) borligini tekshiradi.
            Agar yo'q bo'lsa, qaysi paketni o'rnatishni ko'rsatadi.

            **Linux (qo'lda):**
            ```bash
            curl -L -o uzpp.tar.gz https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/uzpp-linux-x64.tar.gz
            mkdir uzpp-install && tar -xzf uzpp.tar.gz -C uzpp-install
            sudo cp uzpp-install/uzpp /usr/local/bin/
            sudo cp -r uzpp-install/stdlib /usr/local/lib/uzpp/
            sudo apt-get install -y g++ libstdc++-15-dev  # if you don't have g++ yet
            ```

            **macOS (Apple Silicon, qo'lda):**
            ```bash
            curl -L -o uzpp.tar.gz https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/uzpp-macos-arm64.tar.gz
            mkdir uzpp-install && tar -xzf uzpp.tar.gz -C uzpp-install
            sudo cp uzpp-install/uzpp /usr/local/bin/
            sudo cp -r uzpp-install/stdlib /usr/local/lib/uzpp/
            xcode-select --install  # if Command Line Tools missing
            ```

            ### Arxiv tarkibi

            | Fayl | Tarkib |
            |------|--------|
            | `uzpp-setup.exe` | **Windows installer** — uzpp + stdlib + misollar + MinGW (~150 MB) |
            | `install.sh` | **Linux/macOS bir-buyruqli installer** — tizimni aniqlaydi va o'rnatadi |
            | `uzpp-windows-x64.zip` | `uzpp.exe` + `stdlib/` (portable, MinGW yo'q) |
            | `uzpp-linux-x64.tar.gz` | `uzpp` + `stdlib/` |
            | `uzpp-macos-arm64.tar.gz` | `uzpp` + `stdlib/` (Apple Silicon) |
            | `mingw-w64-windows-x64.zip` | Portable C++ kompilyatori (g++) Windows uchun |
          files: |
            dist/uzpp-setup-windows/uzpp-setup.exe
            dist/uzpp-windows-x64/uzpp-windows-x64.zip
            dist/uzpp-linux-x64/uzpp-linux-x64.tar.gz
            dist/uzpp-macos/uzpp-macos-arm64.tar.gz
            dist/uzpp-macos/uzpp-macos-x64.tar.gz
            dist/uzpp-macos/uzpp-macos-universal.tar.gz
            dist/mingw-w64-windows/mingw-w64-windows-x64.zip
            dist/install-sh/install.sh
          draft: false
          prerelease: ${{ contains(github.ref_name, '-') }}

  # ──────────────────────────────────────────────────────────
  # Publish VS Code extension (lightweight — no embedded binary)
  # ──────────────────────────────────────────────────────────
  publish-extension:
    name: Publish VS Code Extension
    needs: [release]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        working-directory: vscode-uzpp
        run: npm install

      - name: Publish to Marketplace
        working-directory: vscode-uzpp
        env:
          VSCE_PAT: ${{ secrets.VSCE_PAT }}
        run: npx @vscode/vsce publish --pat "$VSCE_PAT" --allow-missing-repository
