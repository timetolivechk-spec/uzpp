name: uz++ CI

on:
  push:
    branches: [main, master, dev]
  pull_request:
    branches: [main, master]

jobs:
  # ──────────────────────────────────────────────────────────
  # Windows build (MSYS2 / UCRT64 / GCC, same as dev machine)
  # ──────────────────────────────────────────────────────────
  build-windows:
    name: Windows (MSYS2 / GCC)
    runs-on: windows-latest

    defaults:
      run:
        shell: msys2 {0}

    steps:
      - uses: actions/checkout@v4

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            mingw-w64-ucrt-x86_64-gcc
            mingw-w64-ucrt-x86_64-cmake
            mingw-w64-ucrt-x86_64-ninja
            mingw-w64-ucrt-x86_64-python

      - name: Configure
        run: cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run C++ unit tests
        run: ./build/uzpp_frontend_tests.exe

      - name: Run misollar/ integration tests
        run: |
          PASS=0; FAIL=0
          for f in misollar/01_salom_dunyo.uzpp \
                   misollar/02_fizzbuzz.uzpp \
                   misollar/03_rekursiya.uzpp \
                   misollar/05_kolleksiyalar.uzpp \
                   misollar/07_matn_ishlash.uzpp \
                   misollar/08_json_ishlash.uzpp \
                   misollar/10_ilgor_dasturlash.uzpp; do
            echo "--- Testing: $f ---"
            if ./build/uzpp.exe ishga-tushirish "$f"; then
              PASS=$((PASS+1))
            else
              FAIL=$((FAIL+1))
              echo "FAILED: $f"
            fi
          done
          echo "Results: $PASS passed, $FAIL failed"
          [ $FAIL -eq 0 ]

      - name: Run misollar/ additional integration tests
        run: |
          PASS=0; FAIL=0
          for f in misollar/11_ozgaruvchilar.uzpp \
                   misollar/12_funksiyalar.uzpp \
                   misollar/13_natija.uzpp \
                   misollar/14_moslik.uzpp; do
            echo "--- Testing: $f ---"
            if ./build/uzpp.exe ishga-tushirish "$f"; then
              PASS=$((PASS+1))
            else
              FAIL=$((FAIL+1))
              echo "FAILED: $f"
            fi
          done
          echo "Results: $PASS passed, $FAIL failed"
          [ $FAIL -eq 0 ]

      - name: Run tests/ regression suite (all *.uzpp)
        run: |
          set +e  # don't abort on first failing test; we count failures ourselves
          PASS=0; FAIL=0; FAILED_LIST=""
          for f in tests/*.uzpp; do
            OUT=$(./build/uzpp.exe qurish "$f" 2>&1)
            if echo "$OUT" | grep -q "MUVAFFAQIYAT: Dastur tayyor"; then
              PASS=$((PASS+1))
            else
              FAIL=$((FAIL+1))
              FAILED_LIST="$FAILED_LIST $(basename $f)"
              echo "::group::FAIL $(basename $f)"
              echo "$OUT" | tail -60
              echo "::endgroup::"
            fi
          done
          echo "tests/ regression: $PASS passed, $FAIL failed"
          if [ $FAIL -ne 0 ]; then
            echo "FAILED tests:$FAILED_LIST"
            exit 1
          fi

      - name: Verify uzpp sinov / bench work end-to-end
        run: |
          # `@sinov` / `@bench` glue lives in codegen and references stdlib class
          # names by hand. It broke silently once (wrong class name) and nothing
          # caught it, because `qurish` does not exercise that path.
          ./build/uzpp.exe sinov tests/test_sinov_atribut.uzpp | tee sinov.log
          grep -q "Quladi:0" sinov.log
          ./build/uzpp.exe bench tests/test_sinov_atribut.uzpp | tee bench.log
          grep -q "ns/amal" bench.log

      - name: Verify darslik (textbook) examples still compile
        run: |
          # The textbook is what new users type first. Every ```cpp block in
          # docs/darslik/ is extracted and run through the compiler; blocks that
          # are pseudo-code or deliberately wrong carry an explicit
          # <!-- darslik:skip --> / <!-- darslik:xato --> marker.
          python tests/darslik_tekshir.py build/uzpp.exe
          python tests/darslik_tekshir.py build/uzpp.exe --qurish

      - name: Formatter safety (must never corrupt source)
        run: bash tests/formatlash_xavfsizlik.sh build/uzpp.exe

      - name: Negative tests
        run: bash tests/negative/run.sh build/uzpp.exe

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: uzpp-windows-x64
          path: build/uzpp.exe

  # ──────────────────────────────────────────────────────────
  # macOS build (Apple Silicon, Apple Clang)
  #
  # This job exists because macOS breaks in ways no other platform reproduces:
  #   * `g++` on macOS is Apple Clang, which rejects `-fmodules-ts`;
  #   * the Mach-O linker has no `--gc-sections` (it is `-dead_strip`);
  #   * `/proc/self/exe` does not exist, so the executable path needs Darwin's
  #     own `_NSGetExecutablePath`;
  #   * unsigned binaries are killed outright on Apple Silicon.
  # All four were live bugs. Without CI on macOS they come back silently.
  # ──────────────────────────────────────────────────────────
  build-macos:
    name: macOS (Apple Silicon / Apple Clang)
    runs-on: macos-14

    steps:
      - uses: actions/checkout@v4

      - name: Install build tools
        run: brew install cmake ninja

      - name: Configure
        run: cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build

      - name: Build
        run: cmake --build build --config Release

      - name: Run C++ unit tests
        run: ./build/uzpp_frontend_tests

      - name: Verify the binary is signed and runs
        run: |
          # On Apple Silicon an unsigned binary is killed by the kernel before
          # main() runs, so this check is not cosmetic.
          codesign --verify --verbose build/uzpp
          ./build/uzpp --version

      - name: End-to-end — build and run a real program with Apple Clang
        run: |
          mkdir -p smoke && cd smoke
          cat > salom.uzpp <<'UZPP'
          ulash "uzpp_runtime.hpp"

          butun asosiy() {
              yozish << "Salom, dunyo!" << qator_oxiri;
              qaytarish 0;
          }
          UZPP
          ../build/uzpp ishga-tushirish salom.uzpp | tee out.txt
          grep -q "Salom, dunyo!" out.txt

      - name: Run misollar/ integration tests
        run: |
          set +e
          SKIP=$(grep -vE '^[[:space:]]*(#|$)' tests/.ci_skip_macos 2>/dev/null | tr '\n' '|' | sed 's/|$//')
          PASS=0; FAIL=0; FAILED_LIST=""
          for f in misollar/*.uzpp; do
            bn=$(basename "$f")
            if [ -n "$SKIP" ] && echo "$bn" | grep -qE "^($SKIP)$"; then
              echo "SKIP $bn (in tests/.ci_skip_macos)"; continue
            fi
            echo "--- Testing: $f ---"
            if ./build/uzpp ishga-tushirish "$f" >/dev/null 2>&1; then
              PASS=$((PASS+1))
            else
              FAIL=$((FAIL+1)); FAILED_LIST="$FAILED_LIST $bn"
            fi
          done
          echo "misollar: $PASS passed, $FAIL failed"
          if [ $FAIL -ne 0 ]; then echo "FAILED:$FAILED_LIST"; exit 1; fi

      - name: Run tests/ regression suite (all *.uzpp)
        run: |
          set +e
          SKIP=$(grep -vE '^[[:space:]]*(#|$)' tests/.ci_skip_macos 2>/dev/null | tr '\n' '|' | sed 's/|$//')
          PASS=0; FAIL=0; SKIPPED=0; FAILED_LIST=""
          for f in tests/*.uzpp; do
            bn=$(basename "$f")
            if [ -n "$SKIP" ] && echo "$bn" | grep -qE "^($SKIP)$"; then
              SKIPPED=$((SKIPPED+1)); echo "SKIP $bn (in tests/.ci_skip_macos)"; continue
            fi
            OUT=$(./build/uzpp qurish "$f" 2>&1)
            if echo "$OUT" | grep -q "MUVAFFAQIYAT: Dastur tayyor"; then
              PASS=$((PASS+1))
            else
              FAIL=$((FAIL+1)); FAILED_LIST="$FAILED_LIST $bn"
              echo "::group::FAIL $bn"
              echo "$OUT" | tail -60
              echo "::endgroup::"
            fi
          done
          echo "tests/ regression: $PASS passed, $FAIL failed, $SKIPPED skipped"
          if [ $FAIL -ne 0 ]; then echo "FAILED tests:$FAILED_LIST"; exit 1; fi

      - name: Verify uzpp sinov / bench work end-to-end
        run: |
          ./build/uzpp sinov tests/test_sinov_atribut.uzpp | tee sinov.log
          grep -q "Quladi:0" sinov.log
          ./build/uzpp bench tests/test_sinov_atribut.uzpp | tee bench.log
          grep -q "ns/amal" bench.log

      - name: Verify darslik (textbook) examples still compile
        run: |
          # The textbook is what new users type first. Every ```cpp block in
          # docs/darslik/ is extracted and run through the compiler; blocks that
          # are pseudo-code or deliberately wrong carry an explicit
          # <!-- darslik:skip --> / <!-- darslik:xato --> marker.
          python3 tests/darslik_tekshir.py build/uzpp
          python3 tests/darslik_tekshir.py build/uzpp --qurish

      - name: Formatter safety (must never corrupt source)
        run: bash tests/formatlash_xavfsizlik.sh build/uzpp

      - name: Negative tests
        run: bash tests/negative/run.sh build/uzpp

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: uzpp-macos-arm64
          path: build/uzpp

  # ──────────────────────────────────────────────────────────
  # Linux build (Ubuntu 24.04 / GCC-15 / C++23)
  # GCC-15 is required for full C++23 explicit object parameter support
  # ("deducing this", P0847R7) — GCC-14 on Ubuntu 24.04 rejects the
  # `void f(this Self& self)` syntax we generate.
  # ──────────────────────────────────────────────────────────
  build-linux:
    name: Linux (Ubuntu 24.04 / GCC-15)
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies (GCC-15 via toolchain PPA)
        run: |
          sudo add-apt-repository -y ppa:ubuntu-toolchain-r/test
          sudo apt-get update -qq
          # libstdc++-15-dev is required for <generator> (C++23 coroutines)
          # — gcc-15 ships the compiler but the matching libstdc++ headers
          # come as a separate package on Ubuntu.
          sudo apt-get install -y gcc-15 g++-15 libstdc++-15-dev cmake ninja-build libx11-dev libgl1-mesa-dev
          sudo update-alternatives --install /usr/bin/gcc gcc /usr/bin/gcc-15 100
          sudo update-alternatives --install /usr/bin/g++ g++ /usr/bin/g++-15 100
          g++-15 --version

      - name: Configure
        run: cmake -G Ninja -DCMAKE_BUILD_TYPE=Release -B build
        env:
          CC: gcc-15
          CXX: g++-15

      - name: Build
        run: cmake --build build --config Release
        env:
          CC: gcc-15
          CXX: g++-15

      - name: Run C++ unit tests
        run: ./build/uzpp_frontend_tests

      - name: Run misollar/ integration tests
        run: |
          PASS=0; FAIL=0
          for f in misollar/01_salom_dunyo.uzpp \
                   misollar/02_fizzbuzz.uzpp \
                   misollar/03_rekursiya.uzpp \
                   misollar/05_kolleksiyalar.uzpp \
                   misollar/07_matn_ishlash.uzpp \
                   misollar/08_json_ishlash.uzpp \
                   misollar/10_ilgor_dasturlash.uzpp; do
            echo "--- Testing: $f ---"
            if ./build/uzpp ishga-tushirish "$f"; then
              PASS=$((PASS+1))
            else
              FAIL=$((FAIL+1))
              echo "FAILED: $f"
            fi
          done
          echo "Results: $PASS passed, $FAIL failed"
          [ $FAIL -eq 0 ]

      - name: Run misollar/ additional integration tests
        run: |
          PASS=0; FAIL=0
          for f in misollar/11_ozgaruvchilar.uzpp \
                   misollar/12_funksiyalar.uzpp \
                   misollar/13_natija.uzpp \
                   misollar/14_moslik.uzpp; do
            echo "--- Testing: $f ---"
            if ./build/uzpp ishga-tushirish "$f"; then
              PASS=$((PASS+1))
            else
              FAIL=$((FAIL+1))
              echo "FAILED: $f"
            fi
          done
          echo "Results: $PASS passed, $FAIL failed"
          [ $FAIL -eq 0 ]

      - name: Run tests/ regression suite (all *.uzpp)
        run: |
          set +e  # don't abort on first failing test; we count failures ourselves
          # Read Linux-specific skip list (one filename per line, # for comments)
          SKIP=$(grep -vE '^\s*(#|$)' tests/.ci_skip_linux 2>/dev/null | tr '\n' '|' | sed 's/|$//')
          PASS=0; FAIL=0; SKIPPED=0; FAILED_LIST=""
          for f in tests/*.uzpp; do
            bn=$(basename "$f")
            if [ -n "$SKIP" ] && echo "$bn" | grep -qE "^($SKIP)$"; then
              SKIPPED=$((SKIPPED+1))
              echo "SKIP $bn (in tests/.ci_skip_linux)"
              continue
            fi
            OUT=$(./build/uzpp qurish "$f" 2>&1)
            if echo "$OUT" | grep -q "MUVAFFAQIYAT: Dastur tayyor"; then
              PASS=$((PASS+1))
            else
              FAIL=$((FAIL+1))
              FAILED_LIST="$FAILED_LIST $bn"
              echo "::group::FAIL $bn"
              echo "$OUT" | tail -60
              echo "::endgroup::"
            fi
          done
          echo "tests/ regression: $PASS passed, $FAIL failed, $SKIPPED skipped"
          if [ $FAIL -ne 0 ]; then
            echo "FAILED tests:$FAILED_LIST"
            exit 1
          fi

      - name: Verify uzpp sinov / bench work end-to-end
        run: |
          ./build/uzpp sinov tests/test_sinov_atribut.uzpp | tee sinov.log
          grep -q "Quladi:0" sinov.log
          ./build/uzpp bench tests/test_sinov_atribut.uzpp | tee bench.log
          grep -q "ns/amal" bench.log

      - name: Verify darslik (textbook) examples still compile
        run: |
          # The textbook is what new users type first. Every ```cpp block in
          # docs/darslik/ is extracted and run through the compiler; blocks that
          # are pseudo-code or deliberately wrong carry an explicit
          # <!-- darslik:skip --> / <!-- darslik:xato --> marker.
          python3 tests/darslik_tekshir.py build/uzpp
          python3 tests/darslik_tekshir.py build/uzpp --qurish

      - name: Formatter safety (must never corrupt source)
        run: bash tests/formatlash_xavfsizlik.sh build/uzpp

      - name: Negative tests
        run: bash tests/negative/run.sh build/uzpp

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: uzpp-linux-x64
          path: build/uzpp
